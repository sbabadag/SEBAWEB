name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # NOT: Burada eskiden anahtar icin sabit bir yedek deger vardi
      # (secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_...'). Anahtar
      # yenilendiginde o eski deger sessizce kullanilmaya devam ediyordu ve
      # site veri cekemez hale geliyordu. Artik yedek YOK: anahtar tanimli
      # degilse derleme burada durur, sessizce bozuk site yayinlanmaz.
      - name: Build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://djxgtphcvjshkeccnrvj.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY bos."
            echo "Repo Settings > Secrets and variables > Actions altinda"
            echo "VITE_SUPABASE_ANON_KEY degerini tanimlayin."
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::VITE_SUPABASE_URL bos."
            exit 1
          fi
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
