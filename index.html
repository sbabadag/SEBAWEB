    <!-- ------------------------------------------------------------------
         GoatCounter — ücretsiz ziyaret istatistikleri + sayfada görünen sayaç
         ------------------------------------------------------------------
         Kurulum (tek kez, ~3 dakika):
           1) https://www.goatcounter.com -> Sign up (e-posta + kod seç, ör. "seba")
              Adresin: https://seba.goatcounter.com
           2) Settings -> "Allow adding visitor counts on your website"  -> AÇIK
              (varsayılan KAPALI; açılmazsa sayfadaki sayaç çalışmaz)
           3) Aşağıdaki __GOATCOUNTER_CODE__ değerini seçtiğin kod ile değiştir
         Kod girilene kadar hiçbir istek gönderilmez (boşa trafik olmaz).
         ------------------------------------------------------------------ -->
    <script>
      window.__GOATCOUNTER_CODE__ = 'selahattinbabadag';
      (function () {
        var kod = window.__GOATCOUNTER_CODE__;
        if (!kod || kod.indexOf('BURAYA') === 0) return;

        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://gc.zgo.at/count.js';
        s.setAttribute('data-goatcounter', 'https://' + kod + '.goatcounter.com/count');
        document.head.appendChild(s);
      })();
    </script>

    <!-- ------------------------------------------------------------------
         GitHub Pages SPA yönlendirme DÜZELTMESİ
         public/404.html alt sayfa isteklerini "?/yol" biçimine çevirir;
         aşağıdaki betik onu tekrar "/yol" biçimine döndürür. İkisi birlikte
         çalıştığında /admin/login gibi adresler doğrudan açılabilir.
         (404.html'deki pathSegmentsToKeep = 0, alan adı kökte olduğu için doğru.)
         ------------------------------------------------------------------ -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
